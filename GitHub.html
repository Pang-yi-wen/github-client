<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 本地客户端</title>
<meta name="description" content="通过 api.github.com 浏览 GitHub 的单文件网页客户端">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232f81f7' d='M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-3.42-3.58-8-8-8Z'/%3E%3C/svg%3E">
<style>
/* ---- base ---- */

/* ============================================================
   GitHub 本地客户端 · 样式
   ============================================================ */

:root[data-theme="dark"] {
  /* 取自 @primer/primitives（GitHub 官方设计 token，MIT） */
  --bg: #0d1117;
  --bg-subtle: #151b23;
  --bg-inset: #010409;
  --bg-hover: #1f242c;
  --border: #3d444d;
  --border-muted: #3d444db3;
  --fg: #f0f6fc;
  --fg-muted: #9198a1;
  --fg-subtle: #656c76;
  --accent: #4493f8;
  --accent-hover: #79b8ff;
  --green: #3fb950;
  --red: #f85149;
  --purple: #ab7df8;
  --yellow: #d29922;
  --focus: #1f6feb;
  --shadow: 0 8px 28px rgba(1, 4, 9, .65);
  --code-bg: #151b23;
  --tab-line: #f78166;
}

:root[data-theme="light"] {
  --bg: #ffffff;
  --bg-subtle: #f6f8fa;
  --bg-inset: #f6f8fa;
  --bg-hover: #eef1f4;
  --border: #d1d9e0;
  --border-muted: #d1d9e0b3;
  --fg: #1f2328;
  --fg-muted: #59636e;
  --fg-subtle: #6e7781;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --green: #1a7f37;
  --red: #cf222e;
  --purple: #8250df;
  --yellow: #9a6700;
  --focus: #0969da;
  --shadow: 0 8px 28px rgba(31, 35, 40, .14);
  --code-bg: #f6f8fa;
  --tab-line: #fd8c73;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
code, pre, .mono {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

.dim { color: var(--fg-muted); }
.strong { color: var(--fg); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { margin-left: auto; }

/* ---------- 顶栏 ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 56px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--bg-subtle) 92%, transparent);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg);
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  flex: none;
}
.brand:hover { text-decoration: none; color: var(--fg); }
.brand-dim { color: var(--fg-subtle); font-weight: 400; }

.search-wrap { position: relative; flex: 1; max-width: 600px; display: flex; align-items: center; }
.search-ico { position: absolute; left: 11px; color: var(--fg-muted); pointer-events: none; }
.search-wrap input {
  width: 100%;
  height: 32px;
  padding: 0 12px 0 33px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}
.search-wrap input::placeholder { color: var(--fg-subtle); }
.search-wrap input.is-url {
  border-color: var(--green);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent);
}

.open-item {
  border-left: 3px solid var(--green);
  background: color-mix(in srgb, var(--green) 7%, transparent);
}
.open-item b { font-weight: 600; }

.suggest {
  position: absolute;
  top: 38px; left: 0; right: 0;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
  max-height: 60vh;
  overflow-y: auto;
}
.s-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-muted);
  font-size: 13px;
}
.s-item:last-child { border-bottom: none; }
.s-item:hover, .s-item.active { background: var(--bg-hover); }
.s-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-sub { margin-left: auto; color: var(--fg-muted); font-size: 11.5px; display: flex; align-items: center; gap: 4px; }

/* ---------- 顶栏搜索触发器 ---------- */

.search-trigger {
  width: 100%;
  height: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px 0 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg-subtle);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: border-color .15s, background .15s;
}
.search-trigger:hover {
  border-color: var(--fg-subtle);
  background: var(--bg-hover);
  color: var(--fg-muted);
}
.st-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.st-kbd {
  flex: none;
  font-family: inherit;
  font-size: 11px;
  line-height: 1;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg-subtle);
}

/* ---------- 搜索面板 ---------- */

#modal.top { align-items: flex-start; }

.search-panel {
  width: 100%;
  max-width: 720px;
  margin-top: 9vh;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.sp-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  height: 58px;
  border-bottom: 1px solid var(--border-muted);
}
.sp-ico { color: var(--fg-muted); flex: none; }
.sp-input-row input {
  flex: 1;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: var(--fg);
  font-size: 15.5px;
  font-family: inherit;
}
.sp-input-row input::placeholder { color: var(--fg-subtle); }

.sp-types { display: flex; gap: 4px; padding: 10px 14px 0; flex-wrap: wrap; }
.sp-type {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--fg-muted);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.sp-type:hover { background: var(--bg-hover); color: var(--fg); }
.sp-type.on {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
  font-weight: 500;
}

.sp-filters .filter-bar {
  border: none;
  border-radius: 0;
  background: transparent;
  margin: 4px 0 0;
  padding: 8px 14px;
}

.sp-preview {
  padding: 2px 18px 12px;
  font-size: 11.5px;
  color: var(--fg-muted);
  min-height: 26px;
  word-break: break-all;
}
.sp-preview code {
  background: var(--bg);
  border: 1px solid var(--border-muted);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
}
.sp-ok { color: var(--green); }

.sp-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--border-muted);
  background: var(--bg);
}
.sp-hint { font-size: 11.5px; color: var(--fg-subtle); }

.topnav { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 13px; flex: none; }
.topnav a { color: var(--fg-muted); }
.topnav a:hover, .topnav a.on { color: var(--fg); text-decoration: none; }

.rate {
  font-size: 11px;
  color: var(--fg-subtle);
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  cursor: default;
}
.rate.low { color: var(--red); border-color: color-mix(in srgb, var(--red) 60%, transparent); }

.auth-badge {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--yellow) 50%, transparent);
  color: var(--yellow);
  cursor: pointer;
  background: transparent;
  font-family: inherit;
}
.auth-badge.ok { border-color: color-mix(in srgb, var(--green) 50%, transparent); color: var(--green); }

.ch-badge {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--green) 45%, transparent);
  color: var(--green);
  cursor: pointer;
  background: transparent;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.ch-badge.warn {
  border-color: color-mix(in srgb, var(--yellow) 50%, transparent);
  color: var(--yellow);
}

/* 有新版本时才显示 */
.upd-badge {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  color: var(--accent);
  cursor: pointer;
  background: transparent;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.upd-badge:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.upd-badge:disabled { opacity: .6; cursor: default; }
.upd-badge[hidden] { display: none; }

.ch-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-muted);
  font-size: 12.5px;
}
.ch-row:last-of-type { border-bottom: none; }
.ch-row .dim { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.set-block {
  padding: 14px 0;
  border-bottom: 1px solid var(--border-muted);
}
.set-block:last-of-type { border-bottom: none; padding-bottom: 0; }
.set-block h4 {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tr-custom {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--fg-muted);
  font-size: 15px;
  cursor: pointer;
  padding: 3px 5px;
  border-radius: 5px;
  line-height: 1;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--fg); }

/* ---------- 主区 ---------- */

main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 100px; }

.loading-block { display: flex; justify-content: center; padding: 90px 0; }
/* 仅在占位阶段居中旋转指示器；内容就位后恢复块级流，
   否则 .repo-card 等块级子元素会被当成 flex 项横排，撑破面板 */
.spin-slot:has(> .spinner) { padding: 26px 0; display: flex; justify-content: center; }
.spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.err-box {
  padding: 18px 22px;
  border: 1px solid color-mix(in srgb, var(--red) 55%, transparent);
  border-left-width: 4px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--red) 7%, transparent);
  margin: 18px 0;
}
.err-box h3 { margin: 0 0 6px; font-size: 15px; color: var(--red); }
.err-box p { margin: 0; color: var(--fg-muted); font-size: 13px; word-break: break-word; }
.err-box .btn { margin-top: 12px; }

.empty { text-align: center; padding: 46px 20px; color: var(--fg-muted); font-size: 13px; }

.page-title { font-size: 18px; font-weight: 400; margin: 0 0 8px; }
.lead { color: var(--fg-muted); font-size: 13px; margin: 0 0 20px; }
.foot-note { color: var(--fg-subtle); font-size: 12px; margin-top: 22px; }

/* ---------- 按钮 / 徽标 ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  background: var(--bg-subtle);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .13s, border-color .13s;
}
.btn:hover { background: var(--bg-hover); text-decoration: none; color: var(--fg); }
.btn.primary { background: #238636; border-color: #2ea043; color: #fff; }
.btn.primary:hover { background: #2ea043; }
.btn.ghost { background: transparent; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; gap: 4px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  border: 1px solid var(--border);
  color: var(--fg-muted);
  white-space: nowrap;
  vertical-align: middle;
}
.badge.open { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); background: color-mix(in srgb, var(--green) 12%, transparent); }
.badge.closed { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, transparent); background: color-mix(in srgb, var(--purple) 12%, transparent); }
.badge.merged { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, transparent); background: color-mix(in srgb, var(--purple) 12%, transparent); }

.avatar { border-radius: 50%; background: var(--bg-inset); flex: none; object-fit: cover; vertical-align: middle; }
.avatar-fallback { display: inline-block; border-radius: 50%; background: var(--border); }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--fg-subtle); margin-right: 5px; vertical-align: middle; }

/* ---------- 仓库头 ---------- */

.repo-head { margin-bottom: 6px; }
.repo-title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  font-size: 20px;
  margin: 0 0 8px;
  font-weight: 400;
  line-height: 1.3;
}
.repo-title .owner a { color: var(--fg-muted); }
.repo-title .owner a:hover { color: var(--accent); text-decoration: none; }
.repo-title .sep-slash { color: var(--fg-subtle); }
.repo-title .name { color: var(--accent); font-weight: 600; word-break: break-word; }

.repo-desc { color: var(--fg-muted); font-size: 13.5px; margin-bottom: 8px; max-width: 800px; }

.repo-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.btn.danger {
  border-color: color-mix(in srgb, var(--red) 45%, transparent);
  color: var(--red);
}
.btn.danger:hover {
  background: color-mix(in srgb, var(--red) 12%, transparent);
  border-color: var(--red);
}
.btn.danger:disabled { opacity: .5; }

/* ---------- 对话框 ---------- */

.dialog {
  width: 100%;
  max-width: 520px;
  margin-top: 10vh;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  max-height: 84vh;
  overflow-y: auto;
}
.dialog h3 { margin: 0 0 6px; font-size: 16px; }
.dialog p.hint { color: var(--fg-muted); font-size: 12.5px; margin: 0 0 14px; line-height: 1.65; }
.dialog input[type="text"] {
  width: 100%;
  height: 34px;
  padding: 0 11px;
  margin-bottom: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.dialog input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.dialog textarea {
  width: 100%;
  min-height: 92px;
  padding: 9px 11px;
  margin-bottom: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  font-size: 13px;
  font-family: inherit;
  line-height: 1.65;
  outline: none;
  resize: vertical;
}
.dialog textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.form-row .filt { flex: 1; min-width: 130px; }

/* 详情页的评论框与状态操作 */
.issue-write {
  margin-top: 16px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-subtle);
}
.issue-write textarea {
  width: 100%;
  min-height: 78px;
  padding: 9px 11px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  font-size: 13px;
  font-family: inherit;
  line-height: 1.65;
  outline: none;
  resize: vertical;
}
.issue-write textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.form-check label,
label.form-check { display: inline-flex; align-items: center; gap: 6px; }
.form-check input { accent-color: var(--accent); }

.drop-zone {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 26px 16px;
  text-align: center;
  color: var(--fg-subtle);
  font-size: 12.5px;
  cursor: pointer;
  margin-bottom: 10px;
  transition: border-color .15s, background .15s;
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
}

.file-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.up-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: var(--bg);
  border: 1px solid var(--border-muted);
  border-radius: 6px;
  font-size: 12px;
}
.up-item > span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.up-del {
  flex: none;
  border: none;
  background: transparent;
  color: var(--fg-subtle);
  font-size: 11.5px;
  font-family: inherit;
  cursor: pointer;
}
.up-del:hover { color: var(--red); }

/* 原网址 */

.gh-src {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 9px;
  font-size: 12px;
  color: var(--fg-subtle);
  min-width: 0;
}
.gh-src > svg { flex: none; opacity: .7; }
.gh-src a {
  color: var(--fg-muted);
  font-family: ui-monospace, monospace;
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gh-src a:hover { color: var(--accent); }
.gh-src-cp {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: transparent;
  color: var(--fg-subtle);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: color .12s, border-color .12s;
}
.gh-src-cp:hover { color: var(--fg); border-color: var(--fg-subtle); }

.repo-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 15px;
  font-size: 12.5px;
  color: var(--fg-muted);
}
.repo-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.repo-meta b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

.repo-tabs {
  display: flex;
  gap: 2px;
  margin: 16px 0 18px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.repo-tabs::-webkit-scrollbar { display: none; }
.repo-tabs a {
  padding: 8px 13px;
  color: var(--fg-muted);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  font-size: 13px;
  margin-bottom: -1px;
}
.repo-tabs a:hover { color: var(--fg); text-decoration: none; border-bottom-color: var(--border); }
.repo-tabs a.on { color: var(--fg); border-bottom-color: var(--tab-line); font-weight: 500; }

/* ---------- 筛选栏与分页 ---------- */

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 10px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  align-items: center;
}

.filt {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--fg-muted);
  white-space: nowrap;
}
.filt select,
.filt input {
  height: 28px;
  padding: 0 8px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;
  font-family: inherit;
  outline: none;
  min-width: 84px;
  width: auto;
  margin-bottom: 0;
}
.filt select { cursor: pointer; padding-right: 4px; }
.filt input { min-width: 130px; font-family: ui-monospace, monospace; font-size: 12px; }
.filt select:focus,
.filt input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.panel .filter-bar {
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-top: none;
  margin-bottom: 0;
}

.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 6px 0 10px;
  font-size: 12.5px;
  color: var(--fg-muted);
}
.pager .disabled { opacity: .45; pointer-events: none; }

.search-summary {
  font-size: 12px;
  margin: -4px 0 14px;
  word-break: break-all;
}
.search-summary code {
  background: var(--bg-subtle);
  border: 1px solid var(--border-muted);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11.5px;
}

/* 代码搜索命中 */

.code-hit {
  padding: 11px 15px;
  border-bottom: 1px solid var(--border-muted);
  cursor: pointer;
}
.code-hit:last-child { border-bottom: none; }
.code-hit:hover { background: var(--bg-hover); }
.ch-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  flex-wrap: wrap;
}
.ch-top b { font-weight: 500; color: var(--fg); }
.ch-top .dim { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.ch-frag {
  margin: 8px 0 0;
  padding: 8px 12px;
  background: var(--code-bg);
  border: 1px solid var(--border-muted);
  border-radius: 6px;
  font-family: ui-monospace, monospace;
  font-size: 11.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 92px;
  overflow: hidden;
  color: var(--fg-muted);
}
.ch-frag mark,
mark {
  background: color-mix(in srgb, var(--yellow) 32%, transparent);
  color: var(--fg);
  border-radius: 2px;
  padding: 0 1px;
}

/* ---------- 面板 ---------- */

.panel {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
  margin-bottom: 18px;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 14px;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--fg-muted);
  flex-wrap: wrap;
  min-height: 40px;
}
.panel-head .path-crumb { color: var(--fg); font-size: 12.5px; word-break: break-all; }
.panel-head .path-crumb a { color: var(--fg); }
.panel-head .path-crumb b { font-weight: 600; }

/* ---------- 仓库页双栏（主内容 + 关于） ---------- */

.repo-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 288px;
  gap: 24px;
  align-items: start;
}
.repo-main { min-width: 0; }
.repo-side { position: sticky; top: 72px; }

.about-panel .panel-head { color: var(--fg); font-weight: 600; }
.about-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
}
.about-desc { margin: 0; color: var(--fg); line-height: 1.55; }
.about-link { display: flex; align-items: center; gap: 6px; min-width: 0; }
.about-link a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.about-row { color: var(--fg-muted); font-size: 12.5px; line-height: 1.6; }
.about-stats { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--fg-muted); }
.about-stats span { display: inline-flex; align-items: center; gap: 6px; }
.about-stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.about-warn {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  background: color-mix(in srgb, var(--yellow) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--yellow) 40%, transparent);
  color: var(--yellow);
}

.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topic {
  padding: 1px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  font-size: 11.5px;
  text-decoration: none;
  white-space: nowrap;
}
.topic:hover { background: color-mix(in srgb, var(--accent) 24%, transparent); text-decoration: none; }

.lang-box { display: flex; flex-direction: column; gap: 9px; }
.lang-bar {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--border);
}
.lang-bar span { display: block; height: 100%; }
.lang-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--fg-muted); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.lg b { color: var(--fg); font-weight: 500; }

@media (max-width: 980px) {
  .repo-layout { grid-template-columns: 1fr; }
  .repo-side { position: static; }
  .about-stats { flex-direction: row; flex-wrap: wrap; gap: 16px; }
}

.commit-bar .panel-head { min-height: 38px; }
.commit-bar .ellipsis { min-width: 0; flex: 1; }

/* ---------- 文件列表 ---------- */

.file-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border-muted);
  font-size: 13px;
  cursor: pointer;
}
.file-row:last-child { border-bottom: none; }
.file-row:hover { background: var(--bg-hover); }
.file-row .fname { color: var(--fg); }
.file-row.dir .fname { color: var(--accent); font-weight: 500; }
.file-row .fname-wrap { flex: none; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file-row .fmsg { color: var(--fg-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.file-row .fsize { color: var(--fg-subtle); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }

/* ---------- 代码视图 ---------- */

.code-view {
  display: flex;
  background: var(--code-bg);
  overflow-x: auto;
  font-size: 12.5px;
  line-height: 20px;
  tab-size: 4;
}
.code-view .gutter {
  flex: none;
  padding: 12px 10px 12px 14px;
  text-align: right;
  color: var(--fg-subtle);
  user-select: none;
  border-right: 1px solid var(--border-muted);
  font-family: ui-monospace, monospace;
  font-size: 12px;
  line-height: 20px;
  white-space: pre;
  opacity: .75;
}
.code-view pre { margin: 0; padding: 12px 16px; flex: 1; line-height: 20px; }
.code-view pre code {
  background: none !important;
  padding: 0 !important;
  font-size: 12.5px;
  line-height: 20px;
  white-space: pre;
  font-family: inherit;
}

.binary-note { padding: 50px 20px; text-align: center; color: var(--fg-muted); background: var(--code-bg); font-size: 13px; }

/* ---------- Markdown ---------- */

.markdown-body {
  color: var(--fg);
  font-size: 14.5px;
  line-height: 1.7;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.markdown-body > *:first-child { margin-top: 0 !important; }
.markdown-body > *:last-child { margin-bottom: 0 !important; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin: 1.4em 0 .6em;
  font-weight: 600;
  line-height: 1.3;
}
.markdown-body h1 { font-size: 1.85em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.markdown-body h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.markdown-body h3 { font-size: 1.2em; }
.markdown-body h4 { font-size: 1.05em; }
.markdown-body h5 { font-size: .95em; }
.markdown-body h6 { font-size: .9em; color: var(--fg-muted); }
.markdown-body p { margin: 0 0 1em; }
.markdown-body a { color: var(--accent); }
.markdown-body ul, .markdown-body ol { padding-left: 1.8em; margin: 0 0 1em; }
.markdown-body li { margin: .3em 0; }
.markdown-body li > p { margin: .3em 0; }
.markdown-body blockquote {
  margin: 0 0 1em;
  padding: .2em 1em;
  color: var(--fg-muted);
  border-left: 3px solid var(--border);
}
.markdown-body code {
  background: var(--bg-subtle);
  border: 1px solid var(--border-muted);
  padding: .12em .38em;
  border-radius: 5px;
  font-size: 85%;
}
.markdown-body pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 14px 16px;
  overflow: auto;
  margin: 0 0 1em;
  line-height: 1.55;
}
.markdown-body pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: 12.5px;
  line-height: 1.55;
  white-space: pre;
}
.markdown-body img { max-width: 100%; border-radius: 6px; background: var(--bg-subtle); }
.markdown-body table {
  border-collapse: collapse;
  margin: 0 0 1em;
  display: block;
  overflow: auto;
  max-width: 100%;
}
.markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 6px 13px; }
.markdown-body th { background: var(--bg-subtle); font-weight: 600; }
.markdown-body tr:nth-child(2n) { background: var(--bg-subtle); }
.markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
.markdown-body input[type="checkbox"] { margin-right: .4em; }
.markdown-body .task-list-item { list-style: none; margin-left: -1.4em; }

.readme-box { padding: 24px 30px; }

/* ---------- Issue / PR ---------- */

.issue-head { margin-bottom: 18px; }
.issue-head h1 { font-size: 22px; font-weight: 400; margin: 0 0 10px; line-height: 1.35; word-break: break-word; }
.issue-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }

.issue-row {
  display: flex;
  gap: 11px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--border-muted);
  cursor: pointer;
  align-items: flex-start;
}
.issue-row:last-child { border-bottom: none; }
.issue-row:hover { background: var(--bg-hover); }
.issue-row .i-ico { flex: none; margin-top: 3px; line-height: 0; }
.issue-row .i-main { flex: 1; min-width: 0; }
.issue-row .i-title { font-weight: 500; color: var(--fg); margin-bottom: 3px; word-break: break-word; font-size: 13.5px; }
.issue-row .i-sub { font-size: 12px; color: var(--fg-muted); }
.issue-row .i-count { font-size: 11.5px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 3px; flex: none; margin-top: 3px; }

.label-chip {
  display: inline-block;
  padding: 0 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  margin-left: 4px;
  border: 1px solid transparent;
  line-height: 17px;
  vertical-align: middle;
}

.timeline-item { display: flex; gap: 12px; margin-bottom: 16px; }
.t-avatar { flex: none; }
.t-body { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.t-head {
  padding: 8px 14px;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.t-head b { color: var(--fg); }
.t-link { margin-left: auto; color: var(--fg-subtle); font-size: 11.5px; }
.t-content { padding: 14px 18px; }

/* ---------- 提交 ---------- */

.commit-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 15px;
  border-bottom: 1px solid var(--border-muted);
  cursor: pointer;
  font-size: 13px;
}
.commit-row:last-child { border-bottom: none; }
.commit-row:hover { background: var(--bg-hover); }
.cm-main { flex: 1; min-width: 0; }
.cm-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-sub { color: var(--fg-muted); font-size: 11.5px; }
.commit-msg {
  margin: 0;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: inherit;
  line-height: 1.7;
}

/* ---------- Release ---------- */

.release-item { padding: 16px 18px; border-bottom: 1px solid var(--border-muted); }
.release-item:last-child { border-bottom: none; }
.rel-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 14px; }
.rel-ico { color: var(--green); line-height: 0; }
.rel-body { margin-top: 12px; font-size: 13.5px; color: var(--fg-muted); }
.rel-assets { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
.asset {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  width: fit-content;
  max-width: 100%;
}
.asset:hover { background: var(--bg-hover); text-decoration: none; }

/* ---------- 用户 ---------- */

.profile { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
.profile .p-info h1 { margin: 0 0 2px; font-size: 24px; font-weight: 500; }
.profile .p-info .login { color: var(--fg-muted); font-size: 16px; font-weight: 300; margin-bottom: 10px; }
.profile .p-bio { margin: 8px 0 12px; max-width: 660px; }
.p-stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--fg-muted); flex-wrap: wrap; align-items: center; }
.p-stats b { color: var(--fg); font-weight: 600; }
.p-stats > span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- 仓库卡片 ---------- */

/* 写操作未启用时的说明条：说明原因并给设置入口 */
.write-hint {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--fg-muted);
}

.repo-card { padding: 13px 16px; border-bottom: 1px solid var(--border-muted); min-width: 0; }
.repo-card:last-child { border-bottom: none; }
.rc-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; overflow-wrap: anywhere; }
.rc-name .badge { margin-left: 6px; }
.rc-desc { color: var(--fg-muted); font-size: 12.5px; margin: 3px 0 8px; }
.rc-meta { display: flex; gap: 14px; font-size: 12px; color: var(--fg-muted); align-items: center; flex-wrap: wrap; }
.rc-meta > span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- 首页 ---------- */

.hero { padding: 10px 0 18px; }
.hero h1 { font-size: 25px; margin: 0 0 6px; font-weight: 400; letter-spacing: -.2px; }
.hero p { color: var(--fg-muted); margin: 0; font-size: 13.5px; }

.quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }

.hero-tip {
  color: var(--fg-subtle);
  font-size: 12.5px;
  margin: 10px 0 0;
}

.tk-links {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

/* minmax(0,…)：列宽可收缩到内容最小宽度以下，不被不可压缩内容撑破 */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }

.auth-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  margin: 16px 0;
  border: 1px solid color-mix(in srgb, var(--yellow) 45%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--yellow) 8%, transparent);
  font-size: 12.5px;
  flex-wrap: wrap;
}
.auth-banner > div { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 2px; }
.auth-banner b { color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
.auth-banner span { color: var(--fg-muted); }

/* ---------- 工具页 ---------- */

.tool-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  margin-bottom: 14px;
  background: var(--bg-subtle);
}
.tool-card.plain { background: transparent; }
.tool-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.tool-card p.hint { margin: 0 0 12px; color: var(--fg-muted); font-size: 12.5px; line-height: 1.65; }
.tool-card p.hint:last-child { margin-bottom: 0; }

.copy-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.copy-row:last-child { margin-bottom: 0; }
.copy-row .tag { font-size: 10.5px; color: var(--fg-subtle); width: 54px; flex: none; text-transform: uppercase; letter-spacing: .3px; }
.copy-row input {
  flex: 1;
  height: 30px;
  padding: 0 10px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  font-family: ui-monospace, monospace;
  font-size: 11.5px;
  min-width: 0;
  outline: none;
}
.copy-row input:focus { border-color: var(--accent); }

/* ---------- 弹窗 ---------- */

#modal {
  position: fixed;
  inset: 0;
  background: rgba(1, 4, 9, .72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  backdrop-filter: blur(3px);
}
#modal[hidden] { display: none; }

.modal-card {
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.modal-card h3 { margin: 0 0 8px; font-size: 16px; }
.modal-card p.hint { color: var(--fg-muted); font-size: 12.5px; line-height: 1.7; margin: 0 0 14px; }
.modal-card input {
  width: 100%;
  height: 34px;
  padding: 0 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  font-family: ui-monospace, monospace;
  font-size: 12.5px;
  outline: none;
  margin-bottom: 10px;
}
.modal-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
.modal-card code { background: var(--bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

/* ---------- toast ---------- */

.toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 9px 18px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  font-size: 13px;
  z-index: 999;
  max-width: 80vw;
  text-align: center;
}
.toast[hidden] { display: none; }

/* ---------- 滚动条 ---------- */

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--fg-subtle); }

/* ---------- 响应式 ---------- */

@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .brand span { display: none; }
  .topnav a { display: none; }
  .rate { display: none; }
  main { padding: 16px 12px 70px; }
  .readme-box { padding: 16px; }
  .profile { flex-direction: column; gap: 12px; }
  .file-row .fmsg { display: none; }
}

/* ---------- 下载进度面板 ---------- */
.dl-panel {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .45); z-index: 60; padding: 20px;
}
.dl-panel[hidden] { display: none; }
.dl-card {
  width: 100%; max-width: 380px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 18px 16px; box-shadow: var(--shadow);
}
.dl-title { font-size: 13.5px; margin-bottom: 12px; color: var(--fg); line-height: 1.5; word-break: break-word; }
.dl-bar { height: 8px; background: var(--bg-inset); border-radius: 999px; overflow: hidden; }
.dl-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s; }
.dl-meta { margin-top: 8px; font-size: 11.5px; color: var(--fg-muted); font-family: ui-monospace, monospace; }

/* ---------- 下载指定文件表单 ---------- */
.dl-form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.dl-form input {
  flex: 1; min-width: 120px; height: 32px; padding: 0 10px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; font-size: 12.5px; font-family: inherit; outline: none;
}
.dl-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

<script>
const APP_VERSION = '1.0.4';
'use strict';

/* ============================================================
   GitHub 本地客户端（单文件版）
   唯一数据源：api.github.com —— 本机唯一可达的 GitHub 端点
   不经过任何第三方服务器，凭据只留在本机 localStorage
   ============================================================ */

/* ============================================================
   通道层
   ------------------------------------------------------------
   三条通路，按可用性与延迟自动切换：
     1. 直连 api.github.com      —— 最快，凭据不外流
     2. 公共中转 gh-proxy.org    —— 零配置兜底，凭据会经过第三方
     3. 自建中转（Worker/Nginx）  —— 用户自己部署，长期最稳
   探测端点用 /rate_limit：不消耗额度。
   ============================================================ */

const API_HOST = 'https://api.github.com';
const RAW_HOST = 'https://raw.githubusercontent.com';

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
};

const CH_DIRECT = {
  id: 'direct',
  label: '直连',
  api: API_HOST,
  raw: RAW_HOST,
  trust: true,
  note: '官方接口，速度最快，凭据不经过第三方'
};

const CH_PUBLIC = [
  {
    id: 'ghproxy-org',
    label: 'gh-proxy.org',

/** 用户自建中转：模板里可含 {url}，否则视为前缀 */
function chCustom() {
  const tpl = String(LS.get('ghl_proxy', '') || '').trim();
  if (!tpl) return null;
  return {
    id: 'custom',
    label: '自建',
    tpl,
    trust: true,
    note: '自建中转，凭据经过你自己的服务器'
  };
}

function allChannels() {
  const list = [CH_DIRECT, ...CH_PUBLIC];
  const c = chCustom();
  if (c) list.push(c);
  return list;
}

function joinApi(ch, path) {
  if (ch.id === 'custom') {
    const full = API_HOST + path;
    return ch.tpl.indexOf('{url}') >= 0
      ? ch.tpl.replace('{url}', encodeURIComponent(full))
      : ch.tpl.replace(/\/+$/, '') + '/' + full;
  }
  return ch.api + path;
}

function joinRaw(ch, o, r, ref, p) {
  const seg = encodeURIComponent(o) + '/' + encodeURIComponent(r) + '/' +
              encodeURIComponent(ref) + '/' + encPath(p);
  if (ch.id === 'custom') {
    const full = RAW_HOST + '/' + seg;
    return ch.tpl.indexOf('{url}') >= 0
      ? ch.tpl.replace('{url}', encodeURIComponent(full))
      : ch.tpl.replace(/\/+$/, '') + '/' + full;
  }
  return ch.raw + '/' + seg;
}

/** 所有能取到同一个 raw 的地址，按实测速度排序，供图片逐级降级 */
function rawSources(o, r, ref, p) {

/* ---------------------------- 基础工具 ---------------------------- */

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtNum(n) {
  if (n === null || n === undefined) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}

function fmtSize(b) {
  if (!b && b !== 0) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 45) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 2592000) return Math.floor(s / 86400) + ' 天前';
  if (s < 31536000) return Math.floor(s / 2592000) + ' 个月前';
  return Math.floor(s / 31536000) + ' 年前';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function b64ToText(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

let toastTimer = null;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选中'); }
    ta.remove();
  }
}

/* ---------------------------- API ---------------------------- */

const rate = { remaining: null, limit: null, reset: null };

/* ---------- 通道探测与调度 ---------- */

let channelOrder = [];
const channelStatus = {};
let activeChannel = null;

function probeChannel(ch) {
  // 直连多数时候一秒内就有结果，给它短一些的宽限，避免首屏被拖住
  const limit = ch.id === 'direct' ? 2600 : 6000;
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), limit);
  return fetch(joinApi(ch, '/rate_limit'), {
    signal: ctrl.signal,
    cache: 'no-store',
    headers: { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
  }).then(res => {
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json().then(j => {
      const core = j && j.resources && j.resources.core;
      return {
        ch,
        ms: Math.round(performance.now() - t0),
        quota: core ? core.remaining : 0,
        limit: core ? core.limit : 0
      };
    });
  }).catch(() => {
    clearTimeout(timer);
    return null;
  });
}

async function initChannels() {
  const list = allChannels();
  const results = await Promise.all(list.map(probeChannel));
  list.forEach((ch, i) => { channelStatus[ch.id] = results[i]; });

  const alive = results.filter(Boolean);
  const usable = alive.filter(x => x.quota > 0);
  const pooled = alive.filter(x => x.quota <= 0);
  const pick = (arr, id) => arr.find(x => x.ch.id === id);
  const bySpeed = (a, b) => a.ms - b.ms;

  channelOrder = [];
  // 有余量的通道按「直连 → 自建 → 其他」排；额度已耗尽的垫底，留作最后尝试
  const direct = pick(usable, 'direct');
  const custom = pick(usable, 'custom');
  if (direct) channelOrder.push(direct.ch);
  if (custom) channelOrder.push(custom.ch);
  channelOrder = channelOrder.concat(
    usable.filter(x => x.ch.id !== 'direct' && x.ch.id !== 'custom').sort(bySpeed).map(x => x.ch)
  );
  channelOrder = channelOrder.concat(pooled.sort(bySpeed).map(x => x.ch));

  if (!channelOrder.length) channelOrder = [CH_DIRECT];

  activeChannel = channelOrder[0];
  updateChannelBadge();
  return channelOrder;
}

let channelsReady = null;
function ensureChannels() {
  if (!channelsReady) channelsReady = initChannels();
  return channelsReady;
}

function updateChannelBadge() {
  const el = $('#ch');
  if (!el) return;
  const ch = activeChannel;
  if (!ch) { el.textContent = '—'; return; }
  const st = channelStatus[ch.id];
  el.textContent = ch.label + (st ? ' ' + st.ms + 'ms' : '');
  el.title = '当前通道：' + ch.label + '\n' + ch.note +
    (!ch.trust && TOKEN ? '\n\n注意：访问令牌正经由此服务转发，它可读取你名下的全部仓库' : '') +
    '\n点击查看全部通道';
  el.classList.toggle('warn', !ch.trust);
}

function readRateHeaders(h) {
  const rem = h.get('x-ratelimit-remaining');
  const lim = h.get('x-ratelimit-limit');
  if (rem === null) return;
  rate.remaining = Number(rem);
  rate.limit = Number(lim || 0);
  rate.reset = h.get('x-ratelimit-reset') ? Number(h.get('x-ratelimit-reset')) : null;
  const el = $('#rate');
  if (el) {
    el.textContent = rate.remaining + '/' + rate.limit;
    el.title = 'API 剩余额度' + (rate.reset
      ? '，' + new Date(rate.reset * 1000).toLocaleTimeString('zh-CN') + ' 重置'
      : '');
    el.classList.toggle('low', rate.remaining < 60);
  }
}

/** 单通道请求 */
async function fetchVia(ch, path, opts) {
  const url = joinApi(ch, path);
  const method = opts.method || 'GET';
  const headers = {
    'Accept': opts.accept || 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body !== undefined) {
    headers['Content-Type'] = 'application/json';
    // 明文令牌只发给直连或自建通道
    if (!ch.trust) throw new Error('写请求不允许经过公共中转');
  }

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 20000);
  const init = { headers: headers, signal: ctrl.signal, method: method };
  if (opts.body !== undefined) init.body = JSON.stringify(opts.body);

  let res;
  try {
    res = await fetch(url, init);
  } catch (e) {
    const err = new Error(e.name === 'AbortError' ? '通道超时' : '通道无响应');
    err.channelFail = true;
    throw err;
  } finally {
    clearTimeout(timer);
  }

  readRateHeaders(res.headers);

  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try {
      const j = await res.clone().json();
      if (j && j.message) msg = j.message;
    } catch (_) {}
    const err = new Error(msg);
    err.status = res.status;
    // 服务端故障、限流、额度耗尽都值得换一条通路再试
    err.channelFail = res.status >= 500 || res.status === 429 ||
      (res.status === 403 && rate.remaining === 0);
    if (res.status === 401) err.message = '凭据无效或已过期，请重新设置令牌';
    else if (res.status === 403 && rate.remaining === 0) {
      err.message = 'API 额度已用尽' + (rate.reset
        ? '，' + new Date(rate.reset * 1000).toLocaleTimeString('zh-CN') + ' 重置'
        : '');
    } else if (res.status === 403) {
      err.message = '请求被拒绝：' + msg;
    } else if (res.status === 404) {
      err.message = '未找到该资源（可能不存在，或私有内容需要授权）';
    } else if (res.status === 422) {
      err.message = '请求参数不被接受：' + msg;
    }
    throw err;
  }

  if (opts.blob) return res.blob();
  if (opts.text) return res.text();
  const ct = res.headers.get('content-type') || '';
  if (ct.indexOf('json') >= 0) return res.json();
  return res.text();
}

/* ---------- 本地缓存：命中就不发请求，直接省掉一次配额 ---------- */

const CACHE_PREFIX = 'ghc:';
const CACHE_MAX = 90;
const CACHE_MAX_BYTES = 200 * 1024;

/** 不同资源的有效期。目录和代码变化快，给短一点；仓库信息给长一点 */
function ttlFor(path) {
  const p = path.split('?')[0];
  if (p.indexOf('/search/') === 0) return 10 * 60 * 1000;
  if (p === '/user') return 2 * 60 * 1000;
  if (p.indexOf('/user/') === 0) return 3 * 60 * 1000;
  if (p.indexOf('/readme') > 0) return 30 * 60 * 1000;
  if (p.indexOf('/contents/') > 0) return 5 * 60 * 1000;
  if (p.indexOf('/releases') > 0) return 15 * 60 * 1000;
  if (p.indexOf('/branches') > 0) return 15 * 60 * 1000;
  if (p.indexOf('/commits') > 0) return 5 * 60 * 1000;
  if (p.indexOf('/issues') > 0 || p.indexOf('/pulls') > 0) return 4 * 60 * 1000;
  if (p.indexOf('/users/') === 0) return 20 * 60 * 1000;
  return 8 * 60 * 1000;
}

function cacheCount() {
  let n = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(CACHE_PREFIX) === 0) n++;
    }
  } catch (_) {}
  return n;
}

function clearCache() {
  try {
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(CACHE_PREFIX) === 0) drop.push(k);
    }
    drop.forEach((k) => localStorage.removeItem(k));
    return drop.length;
  } catch (_) {
    return 0;
  }
}

function cacheGet(path) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + path);
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (!rec || typeof rec.t !== 'number') return null;
    if (Date.now() - rec.t > rec.ttl) {
      localStorage.removeItem(CACHE_PREFIX + path);
      return null;
    }
    return rec.v;
  } catch (_) {
    return null;
  }
}

function cacheSet(path, val, ttl) {
  try {
    const body = JSON.stringify({ t: Date.now(), ttl: ttl, v: val });
    if (body.length > CACHE_MAX_BYTES) return;
    if (cacheCount() >= CACHE_MAX) clearCache();
    localStorage.setItem(CACHE_PREFIX + path, body);
  } catch (_) {
    // 配额满或被禁用就静默放弃，不影响功能
  }
}

/** 统一入口：缓存优先，未命中再走通道降级 */
async function gh(path, opts) {
  opts = opts || {};

  // 二进制、纯文本、显式禁用的不走缓存
  const cacheable = !opts.blob && !opts.text && opts.cache !== false;
  const ttl = cacheable ? ttlFor(path) : 0;

  if (cacheable) {
    const hit = cacheGet(path);
    if (hit !== null) return hit;
  }

  const out = await ghFetch(path, opts);
  if (cacheable && out !== null && typeof out === 'object') cacheSet(path, out, ttl);
  return out;
}

/** 真正的请求：按通道顺序尝试，失败自动降级并记住可用的那条 */
async function ghFetch(path, opts) {
  await ensureChannels();

  let lastErr = null;
  for (let i = 0; i < channelOrder.length; i++) {
    const ch = channelOrder[i];
    try {
      const out = await fetchVia(ch, path, opts);
      if (i > 0) {
        channelOrder.splice(i, 1);
        channelOrder.unshift(ch);
        if (activeChannel !== ch) toast('已切换到「' + ch.label + '」通道');
        activeChannel = ch;
        updateChannelBadge();
      } else {
        activeChannel = ch;
      }
      return out;
    } catch (e) {
      if (!e.channelFail) throw e;
      lastErr = e;
    }
  }
  throw new Error('所有通道都无法连接 GitHub' +
    (lastErr ? '（最后一次：' + lastErr.message + '）' : '') +
    '。可在右上角的通道菜单里换用别的通路，或配置自建中转。');
}

/* ---------- 直接读 raw：不消耗 API 额度 ---------- */

async function fetchRawBytes(o, r, ref, path) {
  const urls = rawMirrorList(o, r, ref, path);
  const ctrls = urls.map(() => new AbortController());
  // 并行竞速：第一个成功返回的通道胜出，其余立即取消，避免顺序等待死代理
  return await new Promise((resolve, reject) => {
    let done = false, pending = urls.length, lastErr = null;
    urls.forEach((url, i) => {
      const t = setTimeout(() => ctrls[i].abort(), 15000);
      fetch(url, { signal: ctrls[i].signal })
        .then(async res => {
          clearTimeout(t);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const buf = new Uint8Array(await res.arrayBuffer());
          if (done) return;
          done = true;
          ctrls.forEach((c, j) => { if (j !== i) c.abort(); });
          resolve(buf);
        })
        .catch(e => {
          clearTimeout(t);
          lastErr = e;
          if (--pending === 0 && !done) reject(lastErr || new Error('raw 不可用'));
        });
    });
    setTimeout(() => {
      if (!done) { done = true; ctrls.forEach(c => c.abort()); reject(lastErr || new Error('raw 不可用')); }
    }, 16000);
  });
}

/** 同一 raw 的全部镜像地址，按「自建 → 直连 → jsDelivr CDN → 公共中转」排序。
 *  jsDelivr 是面向国内的快速 CDN；其余公共中转作为兜底。 */
function rawMirrorList(o, r, ref, p) {
  const seg = encodeURIComponent(o) + '/' + encodeURIComponent(r) + '/' +
              encodeURIComponent(ref) + '/' + encPath(p);
  const raw = RAW_HOST + '/' + seg;
  const list = [];
  const c = chCustom();
  if (c) list.push(joinRaw(c, o, r, ref, p));
  list.push(raw);
  list.push('https://cdn.jsdelivr.net/gh/' + encodeURIComponent(o) + '/' +
            encodeURIComponent(r) + '@' + encodeURIComponent(ref) + '/' + encPath(p).replace(/^\/+/, ''));
  list.push('https://ghproxy.net/' + raw);
  list.push('https://mirror.ghproxy.com/' + raw);
  list.push('https://github.moeyy.xyz/' + raw);
  list.push('https://raw.gitmirror.com/' + seg);
  list.push('https://gh-proxy.org/' + raw);
  list.push('https://gh-proxy.com/' + raw);
  list.push('https://ghfast.top/' + raw);
  return list;
}

function mirrorLabel(url) {
  if (url.includes('jsdelivr.net')) return 'jsDelivr CDN';
  if (url.includes('ghproxy.net')) return 'ghproxy.net';
  if (url.includes('mirror.ghproxy.com')) return 'mirror.ghproxy';
  if (url.includes('moeyy.xyz')) return 'moeyy.xyz';
  if (url.includes('gitmirror.com')) return 'gitmirror';
  if (url.includes('gh-proxy.org')) return 'gh-proxy.org';
  if (url.includes('gh-proxy.com')) return 'gh-proxy.com';
  if (url.includes('ghfast.top')) return 'ghfast.top';
  if (url.includes('raw.githubusercontent.com')) return '直连 raw';
  if (url.includes('workers.dev') || url.includes('{url}')) return '自建中转';
  return '中转';
}

/** 用极小的 Range 请求并行探速，挑第一个响应的可用通道，供下载时交给原生下载器 */
async function pickBestRawUrl(o, r, ref, path) {
  const urls = rawMirrorList(o, r, ref, path);
  const labels = urls.map(mirrorLabel);
  const ctrls = urls.map(() => new AbortController());
  return await new Promise(resolve => {
    let done = false, pending = urls.length;
    urls.forEach((url, i) => {
      const t0 = performance.now();
      const t = setTimeout(() => ctrls[i].abort(), 12000);
      fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' }, signal: ctrls[i].signal })
        .then(res => {
          clearTimeout(t);
          if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
          const ms = Math.round(performance.now() - t0);
          if (done) return;
          done = true;
          ctrls.forEach((c, j) => { if (j !== i) c.abort(); });
          resolve({ url, label: labels[i], ms });
        })
        .catch(() => {
          clearTimeout(t);
          if (--pending === 0 && !done) resolve(null);
        });
    });
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 13000);
  });
}

/** 带进度回调的字节下载，用于桌面端在页面内显示速度/百分比 */
function xhrBytes(url, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.responseType = 'arraybuffer';
    let lastT = performance.now(), lastL = 0;
    xhr.onprogress = e => {
      const now = performance.now();
      const dt = (now - lastT) / 1000;
      const speed = dt > 0 ? (e.loaded - lastL) / dt : 0;
      lastT = now; lastL = e.loaded;
      onProgress && onProgress(e.loaded, e.lengthComputable ? e.total : 0, speed);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(new Uint8Array(xhr.response));
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send();
  });
}

function bytesToText(buf) {
  return new TextDecoder('utf-8').decode(buf);
}

const looksBinary = (buf) => buf.subarray(0, 8192).indexOf(0) !== -1;

/** 本客户端的来源仓库。读取其中的 VERSION 与最新构建产物 */
const SELF_REPO = { owner: 'Pang-yi-wen', repo: 'github-client', branch: 'main' };

/** 自动检查的最小间隔；手动检查不受限 */
const UPD_INTERVAL = 6 * 3600 * 1000;

const updEnabled = () => LS.get('ghl_upd_on', '1') !== '0';

/** 更新源：默认 SELF_REPO，可用 ghl_upd_repo（owner/repo）覆盖，供 fork 使用 */
function updRepo() {
  const m = String(LS.get('ghl_upd_repo', '') || '').trim().match(/^([\w.-]+)\/([\w.-]+)$/);
  return m ? { owner: m[1], repo: m[2], branch: 'main' } : SELF_REPO;
}

/** 版本号按点分段逐段数值比较，返回 -1 / 0 / 1 */
function cmpVer(a, b) {
  const pa = String(a || '0').split('.'), pb = String(b || '0').split('.');
  for (let i = 0, n = Math.max(pa.length, pb.length); i < n; i++) {
    const x = parseInt(pa[i] || '0', 10) || 0;
    const y = parseInt(pb[i] || '0', 10) || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

/** raw 通道的全部候选地址，自建中转优先 */
function rawBaseUrls(seg) {
  const list = [
    RAW_HOST + '/' + seg,
    'https://gh-proxy.org/' + RAW_HOST + '/' + seg,
    'https://gh-proxy.com/' + RAW_HOST + '/' + seg,
    'https://ghfast.top/' + RAW_HOST + '/' + seg
  ];
  const c = chCustom();
  if (c) {
    const full = RAW_HOST + '/' + seg;
    list.unshift(c.tpl.indexOf('{url}') >= 0
      ? c.tpl.replace('{url}', encodeURIComponent(full))
      : c.tpl.replace(/\/+$/, '') + '/' + full);
  }
  return list;
}

/** 读取来源仓库的 VERSION：先走 raw（不耗额度），全部失败再走 API */
async function fetchRemoteVersion() {
  const { owner, repo, branch } = updRepo();
  const seg = owner + '/' + repo + '/' + branch + '/VERSION';
  for (const url of rawBaseUrls(seg)) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const line = (await res.text()).trim().split('\n')[0].trim();
      if (line) return line;
    } catch (_) {}
  }
  try {
    const j = await gh('/repos/' + owner + '/' + repo + '/contents/VERSION?ref=' + branch, { cache: false });
    if (j && j.content) return b64ToText(j.content).trim().split('\n')[0].trim();
  } catch (_) {}
  return null;
}

/**
 * 检查更新。force 为 true 时忽略间隔限制（设置面板的手动检查）。
 * 自动检查失败不提示，避免打扰；仅在确实发现新版本时给出徽标与提示。
 */
async function checkUpdate(force) {
  if (!force && !updEnabled()) return updAvailable;
  const last = Number(LS.get('ghl_upd_last', '0') || 0);
  if (!force && Date.now() - last < UPD_INTERVAL) return updAvailable;
  LS.set('ghl_upd_last', String(Date.now()));

  let remote = null;
  try {
    remote = await fetchRemoteVersion();
  } catch (_) {}
  if (!remote) return updAvailable;

  if (cmpVer(remote, APP_VERSION) > 0) {
    updAvailable = { version: remote };
    setUpdBadge(remote);
    toast('发现新版本 ' + remote + '，点击顶栏箭头更新', 6000);
  } else {
    updAvailable = null;
    setUpdBadge(null);
    if (force) toast('已是最新版本（' + APP_VERSION + '）');
  }
  return updAvailable;
}

/** 获取最新构建产物：http(s) 页面热替换文档，file:// 页面下载文件 */
async function applyUpdate() {
  if (!updAvailable) return;
  const { owner, repo, branch } = updRepo();
  const seg = owner + '/' + repo + '/' + branch + '/GitHub.html';
  const btn = $('#upd');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '获取中…'; }
  try {
    let html = null;
    for (const url of rawBaseUrls(seg)) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 30000);
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        // 简单校验：确实是完整的单文件应用
        if (text.length > 50000 && text.indexOf('GitHub') >= 0) { html = text; break; }
      } catch (_) {}
    }
    if (!html) throw new Error('无法获取新版本文件');

    if (location.protocol === 'file:') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = 'GitHub.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('新版本 ' + updAvailable.version + ' 已下载，替换原文件后重新打开');
    } else {
      toast('正在切换到 ' + updAvailable.version);
      document.open();
      document.write(html);
      document.close();
    }
  } catch (e) {
    toast('更新失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

/* ---------------------------- Markdown ---------------------------- */

const mdRenderer = new marked.Renderer();

mdRenderer.code = function (code, infostring) {
  const lang = ((infostring || '').trim().split(/\s+/)[0] || '').toLowerCase();
  let html;
  if (lang && window.hljs && hljs.getLanguage(lang)) {
    try { html = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; }
    catch (_) { html = esc(code); }
  } else {
    html = esc(code);
  }
  return '<pre><code class="hljs' + (lang ? ' language-' + esc(lang) : '') + '">' + html + '</code></pre>';
};

marked.setOptions({ renderer: mdRenderer, gfm: true, breaks: false, headerIds: true, mangle: false });

function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,iframe,object,embed,style,form,input,button,link,meta,base').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(n => {
    for (const a of Array.from(n.attributes)) {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if ((a.name === 'href' || a.name === 'src') && /^\s*(javascript|vbscript|data:text\/html)/i.test(a.value)) {
        n.removeAttribute(a.name);
      }
    }
  });
  return tpl.innerHTML;
}

function resolvePath(baseDir, rel) {
  const parts = String(baseDir || '').split('/').filter(Boolean);
  String(rel || '').split('/').forEach(seg => {
    if (seg === '' || seg === '.') return;
    if (seg === '..') parts.pop();
    else parts.push(seg);
  });
  return parts.join('/');
}

function isRelative(u) {
  return !!u && !/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(u) && u[0] !== '#' && u[0] !== '/';
}

function encPath(p) {
  return String(p).split('/').map(encodeURIComponent).join('/');
}

/* ---------- 站内链接 ---------- */

function link(o, r, kind, ref, p) {
  let s = '#/r/' + encodeURIComponent(o) + '/' + encodeURIComponent(r);
  if (kind) s += '/' + kind;
  if (ref) s += '/' + encodeURIComponent(ref);
  if (p) s += '/' + encPath(p);
  return s;
}

/* ---------- 识别粘贴进来的 GitHub 链接 ---------- */

/**
 * 把 github.com / raw.githubusercontent.com 的网址翻译成站内路由。
 * 认不出就返回 null，交给普通搜索。
 */
function parseGithubUrl(raw) {
  let s = String(raw || '').trim();
  if (!s || s.length > 800) return null;

  // 补全协议
  if (/^(?:www\.)?github\.com\//i.test(s)) s = 'https://' + s;
  else if (/^raw\.githubusercontent\.com\//i.test(s)) s = 'https://' + s;
  if (!/^https?:\/\//i.test(s)) return null;

  let u;
  try { u = new URL(s); } catch (_) { return null; }

  const host = u.hostname.toLowerCase().replace(/^www\./, '');
  let seg;
  try {
    seg = u.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  } catch (_) {
    seg = u.pathname.split('/').filter(Boolean);
  }

  if (host === 'raw.githubusercontent.com') {
    const [o, r, ref, ...rest] = seg;
    if (!o || !r || !ref) return null;
    return {
      hash: link(o, r, 'blob', ref, rest.join('/')),
      label: o + '/' + r + ' · ' + (rest.join('/') || ref)
    };
  }

  if (host !== 'github.com') return null;

  const [owner, repo, kind, ...rest] = seg;
  if (!owner) return null;

  // github.com/<user>
  if (!repo) {
    return { hash: '#/u/' + encodeURIComponent(owner), label: owner };
  }

  // github.com/<owner>/<repo>
  if (!kind) {
    return { hash: link(owner, repo), label: owner + '/' + repo };
  }

  switch (kind) {
    case 'blob': {
      const ref = rest[0], path = rest.slice(1).join('/');
      if (!ref) return null;
      return { hash: link(owner, repo, 'blob', ref, path), label: owner + '/' + repo + ' · ' + (path || ref) };
    }
    case 'tree':
    case 'raw': {
      const ref = rest[0], path = rest.slice(1).join('/');
      if (!ref) return null;
      return {
        hash: path ? link(owner, repo, 'tree', ref, path) : link(owner, repo),
        label: owner + '/' + repo + ' · ' + (path || ref)
      };
    }
    case 'issues':
      if (rest[0] && /^\d+$/.test(rest[0])) {
        return { hash: link(owner, repo, 'issue', rest[0]), label: owner + '/' + repo + ' #' + rest[0] };
      }
      return { hash: link(owner, repo, 'issues'), label: owner + '/' + repo + ' · Issues' };
    case 'pull':
    case 'pulls':
      if (kind === 'pull' && rest[0] && /^\d+$/.test(rest[0])) {
        return { hash: link(owner, repo, 'pull', rest[0]), label: owner + '/' + repo + ' #' + rest[0] };
      }
      return { hash: link(owner, repo, 'pulls'), label: owner + '/' + repo + ' · Pull requests' };
    case 'releases':
      return { hash: link(owner, repo, 'releases'), label: owner + '/' + repo + ' · 发行版' };
    case 'commits': {
      const ref = rest[0] || '';
      return { hash: link(owner, repo, 'commits', ref), label: owner + '/' + repo + ' · 提交' };
    }
    case 'commit':
      if (!rest[0]) return null;
      return { hash: link(owner, repo, 'commit', rest[0]), label: owner + '/' + repo + ' @' + rest[0].slice(0, 7) };
    case 'branches':
      return { hash: link(owner, repo, 'branches'), label: owner + '/' + repo + ' · 分支' };
    case 'archive':
      return { hash: link(owner, repo, 'tools'), label: owner + '/' + repo + ' · 下载' };
    default:
      // 认不出的子路径，退回仓库首页
      return { hash: link(owner, repo), label: owner + '/' + repo };
  }
}

/* ---------- 图片：多个 raw 源逐级降级，最后回落 API 二进制 ---------- */

/** 依次尝试所有 raw 源，全部失败再把图片经 API 取回本地 Blob */
function attachImgChain(img, o, r, ref, p) {
  const sources = rawSources(o, r, ref, p);
  let i = 0;
  img.src = sources[0];
  img.addEventListener('error', function onErr() {
    i++;
    if (i < sources.length) {
      img.src = sources[i];
    } else {
      img.removeEventListener('error', onErr);
      loadImageViaApi(img, o, r, ref, p);
    }
  });
}

async function loadImageViaApi(img, o, r, ref, p) {
  if (img.dataset.tried === '1') return;
  img.dataset.tried = '1';
  try {
    const blob = await gh(
      '/repos/' + o + '/' + r + '/contents/' + encPath(p) + '?ref=' + encodeURIComponent(ref),
      { accept: 'application/vnd.github.raw', blob: true }
    );
    img.src = URL.createObjectURL(blob);
  } catch (_) {
    img.style.opacity = '.2';
  }
}

/* ---------- 重写 Markdown 里的链接与图片 ---------- */

function rewriteLinks(root, ctx) {
  root.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href) return;
    if (href[0] === '#') return;

    // github.com 链接 → 站内
    const m = href.match(/^https?:\/\/(?:www\.)?github\.com\/([^/]+)\/([^/]+)(?:\/(blob|tree|issues|pull|releases|commits)\/([^/?#]+)(?:\/([^?#]*))?)?/);
    if (m) {
      const o2 = m[1], r2 = m[2], kind = m[3], ref = m[4], rest = m[5] || '';
      if (kind) {
        a.setAttribute('href', link(o2, r2, kind, decodeURIComponent(ref), rest));
      } else {
        a.setAttribute('href', link(o2, r2));
      }
      return;
    }

    // raw.githubusercontent.com → 站内 blob 视图
    const rm = href.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
    if (rm) {
      a.setAttribute('href', link(rm[1], rm[2], 'blob', decodeURIComponent(rm[3]), rm[4]));
      return;
    }

    // 相对路径
    if (isRelative(href)) {
      const hashIdx = href.indexOf('#');
      const frag = hashIdx >= 0 ? href.slice(hashIdx) : '';
      const clean = href.split('#')[0].split('?')[0];
      const target = resolvePath(ctx.baseDir, clean);
      a.setAttribute('href', link(ctx.owner, ctx.repo, 'blob', ctx.ref, target) + frag);
      return;
    }

    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
  });

  root.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src');
    if (!src) return;

    // GitHub 的 raw/blob 链接
    const ghRaw = src.match(/^https?:\/\/(?:www\.)?github\.com\/([^/]+)\/([^/]+)\/(?:raw|blob)\/([^/]+)\/(.+?)(?:\?raw=true)?$/);
    if (ghRaw) {
      attachImgChain(img, ghRaw[1], ghRaw[2], decodeURIComponent(ghRaw[3]), ghRaw[4]);
      return;
    }

    const rawGh = src.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
    if (rawGh) {
      attachImgChain(img, rawGh[1], rawGh[2], decodeURIComponent(rawGh[3]), rawGh[4]);
      return;
    }

    // 相对路径 → 仓库内文件
    if (isRelative(src)) {
      const p = resolvePath(ctx.baseDir, src.split('?')[0].split('#')[0]);
      img.setAttribute('loading', 'lazy');
      attachImgChain(img, ctx.owner, ctx.repo, ctx.ref, p);
      return;
    }

    // 绝对地址（avatars / user-images / camo / 外链）直接加载
    img.setAttribute('loading', 'lazy');
    img.addEventListener('error', () => { img.style.opacity = '.25'; }, { once: true });
  });
}

function renderMarkdown(text, ctx) {
  const box = document.createElement('div');
  box.className = 'markdown-body';
  box.innerHTML = sanitize(marked.parse(text || ''));
  if (ctx) rewriteLinks(box, ctx);
  return box;
}

/** 由当前路由推导出对应的 GitHub 原地址 */
function githubUrlFromRoute() {
  let seg, q;
  try {
    const parsed = parseHash();
    seg = parsed.seg;
    q = parsed.q;
  } catch (_) {
    return '';
  }

  if (seg[0] === 'u' && seg[1]) return 'https://github.com/' + seg[1];
  if (seg[0] !== 'r' || !seg[1] || !seg[2]) return '';

  const o = seg[1], r = seg[2], kind = seg[3];
  const base = 'https://github.com/' + o + '/' + r;
  if (!kind) return base;

  if (kind === 'tree' || kind === 'blob') {
    const ref = seg[4] || '';
    const p = seg.slice(5).join('/');
    return base + '/' + kind + '/' + ref + (p ? '/' + p : '');
  }
  if (kind === 'issues') {
    if (seg[4]) return base + '/issues/' + seg[4];
    return base + '/issues' + (q.get('state') === 'closed' ? '?q=is%3Aissue+is%3Aclosed' : '');
  }
  if (kind === 'pulls') {
    if (seg[4]) return base + '/pull/' + seg[4];
    return base + '/pulls' + (q.get('state') === 'closed' ? '?q=is%3Apr+is%3Aclosed' : '');
  }
  if (kind === 'issue') return base + '/issues/' + (seg[4] || '');
  if (kind === 'pull') return base + '/pull/' + (seg[4] || '');
  if (kind === 'commit') return base + '/commit/' + (seg[4] || '');
  if (kind === 'commits') return base + '/commits' + (seg[4] ? '/' + seg[4] : '');
  if (kind === 'releases') return base + '/releases';
  if (kind === 'branches') return base + '/branches';
  return base;
}
